name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      BUNDLE_VERSION: 1.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier le code (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.json

      - name: Construire l'app
        env:
          VITE_BUNDLE_VERSION: ${{ env.BUNDLE_VERSION }}
          HAS_GS_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON != '' && '1' || '0' }}
        run: |
          if [ "$HAS_GS_SECRET" = "1" ] || [ -f google-services.json ]; then export VITE_PUSH_ENABLED=1; else export VITE_PUSH_ENABLED=0; fi
          echo "Notifications : $VITE_PUSH_ENABLED"
          npm run build

      - name: Préparer Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: ./scripts/prepare-android.sh

      - name: Fabriquer l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Signer l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias atelierg37 \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "atelier-g37-${BUNDLE_VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "atelier-g37-${BUNDLE_VERSION}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Paquet de mise à jour automatique
        run: |
          (cd dist && zip -qr ../bundle.zip .)
          echo "BUNDLE_SHA256=$(sha256sum bundle.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "atelier-g37-${BUNDLE_VERSION}.apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: atelier-g37-${{ env.BUNDLE_VERSION }}
          path: |
            app/atelier-g37-${{ env.BUNDLE_VERSION }}.apk
            app/bundle.zip

      - name: Publier la mise à jour pour les téléphones
        if: github.ref == 'refs/heads/main'
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          FN: https://yrtoimldmzlnmsoapcij.supabase.co/functions/v1/publish
        run: |
          set -euo pipefail
          NATIVE=$(node -p "require('./release.json').nativeVersionCode")
          MIN=$(node -p "require('./release.json').minNativeVersionCode ?? 'null'")
          NOTES=$(node -p "require('./release.json').notes || ''")
          URLS=$(curl -sfS -X POST "$FN/prepare" -H "x-publish-key: $PUBLISH_KEY" -H "content-type: application/json" \
            -d "{\"bundleVersion\":\"$BUNDLE_VERSION\"}")
          BUNDLE_URL=$(node -e "console.log(JSON.parse(process.argv[1]).bundle)" "$URLS")
          APK_URL=$(node -e "console.log(JSON.parse(process.argv[1]).apk)" "$URLS")
          curl -sfS -X PUT "$BUNDLE_URL" -H "content-type: application/zip" -H "x-upsert: true" --data-binary @bundle.zip > /dev/null
          curl -sfS -X PUT "$APK_URL" -H "content-type: application/vnd.android.package-archive" -H "x-upsert: true" \
            --data-binary @"atelier-g37-${BUNDLE_VERSION}.apk" > /dev/null
          BODY=$(node -e "console.log(JSON.stringify({bundleVersion:process.env.BUNDLE_VERSION,bundleChecksum:process.env.BUNDLE_SHA256,apkChecksum:process.env.APK_SHA256,nativeVersionCode:Number(process.argv[1]),minNativeVersionCode:process.argv[2]==='null'?null:Number(process.argv[2]),notes:process.argv[3]}))" "$NATIVE" "$MIN" "$NOTES")
          curl -sfS -X POST "$FN/commit" -H "x-publish-key: $PUBLISH_KEY" -H "content-type: application/json" -d "$BODY"
